services:
  postgres:
    image: postgres:17
    container_name: machineslabs-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: machineslabs
    ports:
      - "5432:5432"
    volumes:
      - machineslabs_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d machineslabs"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  machineslabs_pgdata:
